<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pendaftaran</title>
    <link rel="stylesheet" href="stylepersonal.css">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Jost:wght@100..900&display=swap" rel="stylesheet">

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css" integrity="sha512-Evv84Mr4kqVGRNSgIGL/F/aIDqQb7xQ2vcrdIwxfjThSH8CSR7PBEakCr51Ck+w+/U6swU2Im1vVX0SVk9ABhg==" crossorigin="anonymous" referrerpolicy="no-referrer" />

<link href='https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css' rel='stylesheet'>
</head>
<body>
	<header>
        <a href="#" class="logo"><img src="Snaphere_Logo.png" alt=""></a>
        <h2>Pendaftaran</h2>

        <ul class="navmenu">
            <li><a href="Layanan dan Jasa Fotografi.html">Home</a></li>
        </ul>

        <div class="nav-icon">
            
            <div class="bx bx-menu" id="menu-icon"></div>
        </div>
    </header>

    <div class="container">
		<form method="post" action="https://script.google.com/macros/s/AKfycbxigLN5JRVA1ta7Lxy3fQ-M2ESXtXLsK3WmDGD4ocrt4TzZI1ocA2J3deesaaYbUGxLug/exec" name="contact-form">
			<div class="title">Registration</div>
				<div class="content">
					<div class="user-details">
					<!-- Input for Full Name -->
						<div class="input-box">
							<span class="details">Nama-Depan</span>
							<input type="text" placeholder="" required>
						</div>
					<!-- Input for Username -->
						<div class="input-box">
							<span class="details">Nama-Belakang</span>
							<input type="text" placeholder="" required>
						</div>
					<!-- Input for Email -->
						<div class="input-box">
							<span class="details">Email</span>
							<input type="text" placeholder="" required>
						</div>
					<!-- Input for Phone Number -->
						<div class="input-box">
							<span class="details">No Telepon</span>
							<input type="text" placeholder="" required>
						</div>
					<!-- Input for Password -->
						<div class="input-box">
							<span class="details">Alamat</span>
							<input type="text" placeholder="" required>
						</div>
					<!-- Input for Confirm Password -->
						<div class="input-box">
							<span class="details">Packages</span>
							<input type="text" placeholder="" required>
						</div>
					</div>
					<!-- Submit button -->
					<div class="button">
						<input type="submit" value="Register">
					</div>
		</form>
	</div>

	<script src="Personal-Data-Information.js"></script>
	
</body>
</html>
